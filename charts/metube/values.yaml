# -- Number of replicas. Must be 1.
replicaCount: 1

image:
  # -- Image repository. This is the image published by the MeTube project itself.
  repository: ghcr.io/alexta69/metube
  # -- Image tag. Pin this in production. MeTube releases are dated, not semver.
  tag: "2026.09.26"
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image digest. When set, takes precedence over `image.tag`.
  digest: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the fully qualified app name used for resource names
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty.
  name: ""
  # -- Mount the ServiceAccount API token. Not needed; nothing here uses the
  # Kubernetes API.
  automount: false

# The image's entrypoint does read PUID/PGID, but only when it starts as root:
# as UID 0 it chowns the download directories and `gosu`-drops, and otherwise it
# runs as whoever Kubernetes gave it. The `securityContext` below takes the
# second path, so PUID/PGID are not set here.
env:
  # -- Timezone. Ignored if a webhook like k8tz injects one.
  TZ: Etc/UTC
  # -- Umask for created files. 022 leaves them group- and world-readable, so a
  # media server running as another UID can still index them.
  UMASK: "022"
  # -- Log level: CRITICAL, ERROR, WARNING, INFO or DEBUG
  LOGLEVEL: INFO

# MeTube is configured entirely through environment variables. The ones worth a
# named value are here; anything else the project documents can go in
# `extraEnv`.
metube:
  # Downloads land in the media library rather than a scratch area: nothing
  # imports them afterwards the way an *arr imports a torrent, so where MeTube
  # writes them is where they stay.
  # -- Finished downloads directory (`DOWNLOAD_DIR`). Must be inside
  # `persistence.media.mountPath` when the media volume is mounted.
  downloadDir: /data/media/youtube
  # -- Audio-only downloads directory (`AUDIO_DOWNLOAD_DIR`). Falls back to
  # `downloadDir` when empty.
  audioDownloadDir: ""
  # Partial downloads are written here and moved into place when they finish. A
  # move within one filesystem is a rename; across filesystems it is a full copy
  # of the finished file, which on a large download is slow and needs the space
  # twice. Empty keeps it alongside `downloadDir`, which is always safe.
  # -- Directory for in-progress downloads (`TEMP_DIR`). Falls back to
  # `downloadDir` when empty.
  tempDir: ""
  # The queue, not the videos. Kept on the config volume so the media volume
  # holds only finished files, and so a queue survives a restart.
  # -- Directory for the download queue state (`STATE_DIR`)
  stateDir: /config/state
  # -- Sub-path MeTube is served under (`URL_PREFIX`), for a reverse proxy that
  # does not strip the prefix. Must start and end with `/`, e.g. `/metube/`.
  # The probes below follow it automatically.
  urlPrefix: ""
  # -- Filename template for downloads (`OUTPUT_TEMPLATE`), in yt-dlp syntax
  outputTemplate: "%(title)s.%(ext)s"
  # -- Filename template for playlist downloads (`OUTPUT_TEMPLATE_PLAYLIST`)
  outputTemplatePlaylist: "%(playlist_title)s/%(title)s.%(ext)s"
  # -- Offer subdirectories of `downloadDir` as download targets in the UI
  # (`CUSTOM_DIRS`)
  customDirs: true
  # -- Let the UI create those subdirectories (`CREATE_CUSTOM_DIRS`)
  createCustomDirs: true
  # -- Delete the file from disk when a download is removed in the UI
  # (`DELETE_FILE_ON_TRASHCAN`)
  deleteFileOnTrashcan: false
  # -- Seconds after which finished downloads leave the UI list.
  # 0 keeps them (`CLEAR_COMPLETED_AFTER`).
  clearCompletedAfter: 0
  # -- Options passed straight to yt-dlp (`YTDL_OPTIONS`). Rendered to JSON, so
  # use the option names yt-dlp's Python API takes.
  ytdlOptions: {}
  #  format: bestvideo[height<=1080]+bestaudio/best
  #  writesubtitles: true
  #  postprocessors:
  #    - key: FFmpegMetadata

persistence:
  config:
    # -- Persist the application's data directory (`/config`)
    enabled: true
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- StorageClass. Falls back to `global.storageClass`, then the cluster default.
    storageClass: ""
    # -- Access mode for the config volume
    accessMode: ReadWriteOnce
    # -- Size of the config volume
    size: 1Gi
    # -- Annotations for the config PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled
    retain: false

  media:
    # -- Mount the shared media volume. MeTube writes finished downloads
    # straight into the library, so this is the same claim, at the same path,
    # as the *arrs and the media servers use.
    enabled: false
    # -- Use an existing PVC. Required when `enabled` is true and `size` is unset.
    existingClaim: ""
    # -- Mount path for the media volume
    mountPath: /data
    # -- StorageClass for the media volume
    storageClass: ""
    # -- Access mode for the media volume
    accessMode: ReadWriteMany
    # -- Size of the media volume, when the chart creates it
    size: ""
    # -- Annotations for the media PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled. On by default: it
    # holds the library.
    retain: true

service:
  # -- Service type
  type: ClusterIP
  # -- Service port. The container listens on 8081.
  port: 8081
  # -- Node port, when `service.type` is NodePort
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Service labels
  labels: {}
  # -- Static cluster IP
  clusterIP: ""
  # -- Load balancer IP, when `service.type` is LoadBalancer
  loadBalancerIP: ""
  # -- Session affinity
  sessionAffinity: ""

ingress:
  # -- Create an Ingress
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: metube.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: metube-tls
  #    hosts:
  #      - metube.local

# Gateway API alternative to `ingress`. Both may be enabled at once.
httpRoute:
  # -- Create an HTTPRoute (Gateway API)
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Gateways this route attaches to
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  # -- Hostnames matched by the route
  hostnames: []
  # -- Route rules. A sensible default rule is generated when empty.
  rules: []

# No CPU limit: throttling makes the work slower, never safer, and MeTube shells
# out to ffmpeg to remux and to merge separate video and audio streams.
# -- Resource requests and limits
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 2Gi

# OnRootMismatch: otherwise every pod start re-chowns the whole media volume.
# -- Pod-level security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  supplementalGroups: []
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The image starts as root by default and
# drops to PUID/PGID itself; a non-root UID here makes it skip that and run as
# this user directly. `readOnlyRootFilesystem` stays false: MeTube writes
# yt-dlp's cache and the POT provider's log outside its data directories. If it
# cannot write to a download directory, align `podSecurityContext.fsGroup` with
# `runAsUser`.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# The UI is served at the root, or under `metube.urlPrefix` when that is set -
# the probes pick the prefix up automatically, so a prefixed deployment does not
# silently fail its health checks against a 404.
# -- Liveness probe against the UI
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe. Generous by default: the first start may pull a yt-dlp
# nightly and has to bring up the POT provider alongside the web server.
startupProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# Recreate is required with an RWO config volume.
# -- Deployment strategy
updateStrategy:
  type: Recreate

podDisruptionBudget:
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: ""
  # -- Maximum unavailable pods
  maxUnavailable: 1

networkPolicy:
  # -- Create a NetworkPolicy
  enabled: false
  # -- Ingress rules. When empty, all ingress to the service port is allowed.
  ingress: []
  # -- Egress rules. When empty, no egress restrictions are applied.
  egress: []

# -- Annotations for the pod
podAnnotations: {}
# -- Labels for the pod
podLabels: {}
# -- Annotations for the Deployment
deploymentAnnotations: {}
# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []
# -- Priority class name
priorityClassName: ""
# -- Runtime class name
runtimeClassName: ""
# -- DNS policy
dnsPolicy: ""
# -- DNS config
dnsConfig: {}
# -- Host aliases
hostAliases: []
# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- Additional environment variables, as a map of name to value
extraEnv: {}
# -- Additional environment variables in raw format, for `valueFrom`.
extraEnvRaw: []
# -- Additional envFrom sources
extraEnvFrom: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts for the main container
extraVolumeMounts: []
# -- Additional sidecar containers
extraContainers: []
# -- Additional init containers
extraInitContainers: []
# -- Additional arguments for the main container
extraArgs: []
# -- Additional labels applied to every resource in the chart
commonLabels: {}
# -- Additional annotations applied to every resource in the chart
commonAnnotations: {}
