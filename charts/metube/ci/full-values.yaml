# Exercises every optional template in the chart at once.
#
# `ct install` installs this on a kind cluster, so everything here has to be
# able to come up there. Configuration that needs something kind does not have
# - a PostgreSQL server, a GPU, VPN credentials - is rendered by the lint job
# instead.
replicaCount: 1

persistence:
  config:
    enabled: true
    size: 1Gi
    retain: true
  media:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    mountPath: /data

# Exercises the env block and the download-directory guards. The prefix also
# moves the probes, so a green install here proves they followed it.
metube:
  downloadDir: /data/media/youtube
  audioDownloadDir: /data/media/youtube/audio
  tempDir: /data/media/youtube/.incomplete
  stateDir: /config/state
  urlPrefix: /metube/
  outputTemplate: "%(uploader)s - %(title)s.%(ext)s"
  customDirs: true
  createCustomDirs: true
  deleteFileOnTrashcan: true
  clearCompletedAfter: 3600
  ytdlOptions:
    format: bestvideo[height<=480]+bestaudio/best
    writesubtitles: false

service:
  type: ClusterIP
  port: 8081
  annotations:
    example.com/annotation: "true"
  labels:
    example.com/label: "true"

ingress:
  enabled: true
  className: nginx
  annotations:
    example.com/annotation: "true"
  hosts:
    - host: metube.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: metube-tls
      hosts:
        - metube.example.com

httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - metube.example.com

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  egress:
    - to:
        - namespaceSelector: {}
    # These apps need the internet; in-cluster-only egress breaks startup.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32

serviceAccount:
  create: true
  annotations:
    example.com/annotation: "true"

podAnnotations:
  example.com/annotation: "true"
podLabels:
  example.com/label: "true"
commonLabels:
  example.com/common: "true"
commonAnnotations:
  example.com/common: "true"

nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: example.com/taint
    operator: Exists
    effect: NoSchedule
priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 60

extraEnv:
  EXAMPLE_PLAIN: "value"
extraEnvRaw:
  - name: EXAMPLE_FROM_FIELD
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
extraEnvFrom:
  - configMapRef:
      name: extra-config
      optional: true
extraVolumes:
  - name: scratch
    emptyDir: {}
extraVolumeMounts:
  - name: scratch
    mountPath: /scratch
extraInitContainers:
  - name: init-noop
    image: busybox:latest
    command: ["/bin/true"]
extraContainers:
  - name: sidecar-noop
    image: busybox:latest
    command: ["/bin/sh", "-c", "sleep infinity"]
