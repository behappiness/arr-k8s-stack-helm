# Exercises every optional template in the chart at once.
#
# `ct install` installs this on a kind cluster, so everything here has to be
# able to come up there. Configuration that needs something kind does not have
# - a PostgreSQL server, a GPU, VPN credentials - is rendered by the lint job
# instead.
replicaCount: 1

config:
  acceptLegalNotice: true
  torrentingPort: 6881

metrics:
  enabled: true
  username: admin
  password: ci-only-not-a-real-password
  serviceMonitor:
    enabled: true

persistence:
  config:
    enabled: true
    size: 1Gi
    retain: true
  media:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    mountPath: /data

service:
  type: ClusterIP
  port: 8080
  annotations:
    example.com/annotation: "true"
  labels:
    example.com/label: "true"

ingress:
  enabled: true
  className: nginx
  annotations:
    example.com/annotation: "true"
  hosts:
    - host: qbittorrent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: qbittorrent-tls
      hosts:
        - qbittorrent.example.com

httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - qbittorrent.example.com

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  egress:
    - to:
        - namespaceSelector: {}
    # These apps need the internet; in-cluster-only egress breaks startup.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32

serviceAccount:
  create: true
  annotations:
    example.com/annotation: "true"

podAnnotations:
  example.com/annotation: "true"
podLabels:
  example.com/label: "true"
commonLabels:
  example.com/common: "true"
commonAnnotations:
  example.com/common: "true"

nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: example.com/taint
    operator: Exists
    effect: NoSchedule
priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 60

extraEnv:
  EXAMPLE_PLAIN: "value"
extraEnvRaw:
  - name: EXAMPLE_FROM_FIELD
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
extraEnvFrom:
  - configMapRef:
      name: extra-config
      optional: true
extraVolumes:
  - name: scratch
    emptyDir: {}
extraVolumeMounts:
  - name: scratch
    mountPath: /scratch
extraInitContainers:
  - name: init-noop
    image: busybox:latest
    command: ["/bin/true"]
extraContainers:
  - name: sidecar-noop
    image: busybox:latest
    command: ["/bin/sh", "-c", "sleep infinity"]
