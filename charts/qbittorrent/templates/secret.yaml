{{- if include "qbittorrent.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  metrics-password: {{ .Values.metrics.password | quote }}
{{- end }}
