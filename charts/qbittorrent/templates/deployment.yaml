{{- include "qbittorrent.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.deploymentAnnotations .Values.commonAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pod when the rendered config changes. */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "qbittorrent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qbittorrent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "qbittorrent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: bittorrent-tcp
              containerPort: {{ .Values.config.torrentingPort }}
              protocol: TCP
            - name: bittorrent-udp
              containerPort: {{ .Values.config.torrentingPort }}
              protocol: UDP
          env:
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            {{- /*
              The official image refuses to start unless the legal notice is
              confirmed, so this is set from config.acceptLegalNotice.
            */}}
            - name: QBT_LEGAL_NOTICE
              value: {{ ternary "confirm" "" .Values.config.acceptLegalNotice | quote }}
            - name: QBT_WEBUI_PORT
              value: {{ .Values.service.port | quote }}
            - name: QBT_TORRENTING_PORT
              value: {{ .Values.config.torrentingPort | quote }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnvRaw }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.persistence.media.enabled }}
            {{- /* One mount, no subPath: hardlinks need a single filesystem. */}}
            - name: media
              mountPath: {{ .Values.persistence.media.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if eq .Values.vpn.mode "gluetun" }}
        {{- /*
          gluetun shares this pod's network namespace, so every packet
          qBittorrent sends leaves through the tunnel and gluetun's firewall
          acts as the killswitch. FIREWALL_INPUT_PORTS must list the web UI and
          exporter ports, otherwise the Service cannot reach them.
        */}}
        - name: gluetun
          image: "{{ .Values.vpn.gluetun.image.repository }}:{{ .Values.vpn.gluetun.image.tag }}"
          imagePullPolicy: {{ .Values.vpn.gluetun.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: FIREWALL_INPUT_PORTS
              value: "{{ .Values.service.port }}{{ if .Values.metrics.enabled }},{{ .Values.metrics.port }}{{ end }}"
            {{- with .Values.vpn.lanNetworks }}
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.vpn.gluetun.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.vpn.gluetun.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.vpn.gluetun.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          env:
            - name: QBITTORRENT_HOST
              value: 127.0.0.1
            - name: QBITTORRENT_PORT
              value: {{ .Values.service.port | quote }}
            - name: EXPORTER_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- if .Values.metrics.existingSecret }}
            - name: QBITTORRENT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret }}
                  key: {{ .Values.metrics.existingSecretUsernameKey }}
            - name: QBITTORRENT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret }}
                  key: {{ .Values.metrics.existingSecretPasswordKey }}
            {{- else }}
            {{- with .Values.metrics.username }}
            - name: QBITTORRENT_USER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.metrics.password }}
            - name: QBITTORRENT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "qbittorrent.fullname" . }}
                  key: metrics-password
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          {{- if .Values.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "qbittorrent.configClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "qbittorrent.mediaClaimName" . }}
        {{- end }}
        {{- if ne .Values.vpn.mode "none" }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
