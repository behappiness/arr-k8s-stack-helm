# -- Number of replicas. Must be 1.
replicaCount: 1

image:
  # No official image; LinuxServer and hotio share the PUID/PGID/UMASK/TZ
  # contract.
  # -- Image repository
  repository: lscr.io/linuxserver/sonarr
  # -- Image tag. Pin this in production.
  tag: "4.0.19.2979-ls321"
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image digest. When set, takes precedence over `image.tag`.
  digest: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the fully qualified app name used for resource names
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty.
  name: ""
  # -- Mount the ServiceAccount API token. Not needed; nothing here uses the
  # Kubernetes API.
  automount: false

# These images start as root and use s6-overlay to drop to PUID:PGID.
env:
  # -- UID the application drops to
  PUID: 1000
  # -- GID the application drops to
  PGID: 1000
  # -- Umask. `002` keeps files group-writable so the other apps can use them.
  UMASK: "002"
  # -- Timezone. Ignored if a webhook like k8tz injects one.
  TZ: Etc/UTC

config:
  # -- URL base for subpath hosting, e.g. `/sonarr`. The probes are prefixed
  # with it automatically.
  urlBase: ""

persistence:
  config:
    # -- Persist Sonarr's configuration directory (`/config`)
    enabled: true
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- StorageClass. Falls back to `global.storageClass`, then the cluster default.
    storageClass: ""
    # -- Access mode for the config volume
    accessMode: ReadWriteOnce
    # -- Size of the config volume
    size: 1Gi
    # -- Annotations for the config PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled
    retain: false

  media:
    # One mount for downloads and library: hardlinks need a single filesystem.
    # -- Mount the shared media volume. Must be the same claim and path as
    # the other applications use.
    enabled: false
    # -- Use an existing PVC. Required when `enabled` is true and `size` is unset.
    existingClaim: ""
    # -- Mount path for the media volume
    mountPath: /data
    # -- StorageClass for the media volume
    storageClass: ""
    # -- Access mode for the media volume
    accessMode: ReadWriteMany
    # -- Size of the media volume, when the chart creates it
    size: ""
    # -- Annotations for the media PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled. On by default: it
    # holds the library.
    retain: true

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8989
  # -- Node port, when `service.type` is NodePort
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Service labels
  labels: {}
  # -- Static cluster IP
  clusterIP: ""
  # -- Load balancer IP, when `service.type` is LoadBalancer
  loadBalancerIP: ""
  # -- Session affinity
  sessionAffinity: ""

ingress:
  # -- Create an Ingress
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: sonarr.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: sonarr-tls
  #    hosts:
  #      - sonarr.local

# Gateway API alternative to `ingress`. Both may be enabled at once.
httpRoute:
  # -- Create an HTTPRoute (Gateway API)
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Gateways this route attaches to
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  # -- Hostnames matched by the route
  hostnames: []
  # -- Route rules. A sensible default rule is generated when empty.
  rules: []

# No CPU limit: throttling makes the work slower, never safer.
# -- Resource requests and limits
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 2Gi

# OnRootMismatch: otherwise every pod start re-chowns the whole media volume.
# -- Pod-level security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  supplementalGroups: []
  seccompProfile:
    type: RuntimeDefault

# Root, because s6 drops to PUID:PGID itself. The capabilities are what s6
# needs and stay within the PSA baseline profile.
# -- Container-level security context
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

# -- Liveness probe. `/ping` is unauthenticated and cheap.
livenessProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe
readinessProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe. Generous by default: first start migrates the database and
# large libraries take a while.
startupProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# Recreate is required with an RWO config volume.
# -- Deployment strategy
updateStrategy:
  type: Recreate

podDisruptionBudget:
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: ""
  # -- Maximum unavailable pods
  maxUnavailable: 1

networkPolicy:
  # -- Create a NetworkPolicy
  enabled: false
  # -- Ingress rules. When empty, all ingress to the service port is allowed.
  ingress: []
  # -- Egress rules. When empty, no egress restrictions are applied.
  egress: []

# -- Annotations for the pod
podAnnotations: {}
# -- Labels for the pod
podLabels: {}
# -- Annotations for the Deployment
deploymentAnnotations: {}
# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []
# -- Priority class name
priorityClassName: ""
# -- Runtime class name
runtimeClassName: ""
# -- DNS policy
dnsPolicy: ""
# -- DNS config
dnsConfig: {}
# -- Host aliases
hostAliases: []
# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- Additional environment variables, as a map of name to value
extraEnv: {}
# -- Additional environment variables in raw format, for `valueFrom`.
extraEnvRaw: []
# -- Additional envFrom sources
extraEnvFrom: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts for the main container
extraVolumeMounts: []
# -- Additional sidecar containers
extraContainers: []
# -- Additional init containers
extraInitContainers: []
# -- Additional arguments for the main container
extraArgs: []
# -- Additional labels applied to every resource in the chart
commonLabels: {}
# -- Additional annotations applied to every resource in the chart
commonAnnotations: {}
