{{- include "samba.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "samba.fullname" . }}
  labels:
    {{- include "samba.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.deploymentAnnotations .Values.commonAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "samba.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pod when the password changes. */}}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "samba.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "samba.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "samba.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: smb
              {{- /* Fixed: smbd listens on 445. */}}
              containerPort: 445
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            {{- /*
              The image builds smb.conf from these. A space in a setting name
              is written _SPACE_; see the ServerContainers/samba README.
            */}}
            - name: SAMBA_GLOBAL_CONFIG_server_SPACE_min_SPACE_protocol
              value: SMB3
            - name: SAMBA_GLOBAL_CONFIG_restrict_SPACE_anonymous
              value: "2"
            - name: SAMBA_GLOBAL_CONFIG_load_SPACE_printers
              value: "no"
            - name: SAMBA_GLOBAL_CONFIG_disable_SPACE_netbios
              value: "yes"
            {{- range $k, $v := .Values.extraGlobalConfig }}
            - name: SAMBA_GLOBAL_CONFIG_{{ $k | replace " " "_SPACE_" }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /*
              The image takes the username from the variable name, so the name
              is built here and only the password comes from the Secret.
            */}}
            - name: ACCOUNT_{{ .Values.auth.username }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "samba.secretName" . }}
                  key: password
            - name: UID_{{ .Values.auth.username }}
              value: {{ .Values.auth.uid | quote }}
            {{- if .Values.persistence.media.enabled }}
            - name: SAMBA_VOLUME_CONFIG_{{ .Values.share.name }}
              value: >-
                [{{ .Values.share.name }}];
                path = {{ .Values.persistence.media.mountPath }};
                valid users = {{ .Values.auth.username }};
                force user = {{ .Values.auth.username }};
                browseable = {{ ternary "yes" "no" .Values.share.browseable }};
                read only = {{ ternary "yes" "no" .Values.share.readOnly }};
                create mask = {{ .Values.share.createMask }};
                directory mask = {{ .Values.share.directoryMask }};
                guest ok = no
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnvRaw }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.media.enabled }}
            - name: media
              mountPath: {{ .Values.persistence.media.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "samba.mediaClaimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
