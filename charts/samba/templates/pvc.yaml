{{- if and .Values.persistence.media.enabled (not .Values.persistence.media.existingClaim) .Values.persistence.media.size }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-media" (include "samba.fullname" .) }}
  labels:
    {{- include "samba.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.persistence.media.annotations .Values.commonAnnotations }}
  {{- if .Values.persistence.media.retain }}
  {{- $annotations = merge (dict "helm.sh/resource-policy" "keep") $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.media.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.media.size }}
  {{- include "samba.storageClass" (dict "persistence" .Values.persistence.media "global" .Values.global "purpose" "media") | nindent 2 }}
{{- end }}
