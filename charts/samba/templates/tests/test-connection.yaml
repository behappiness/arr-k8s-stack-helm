apiVersion: v1
kind: Pod
metadata:
  name: {{ include "samba.fullname" . }}-test-connection
  labels:
    {{- include "samba.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "connecting to {{ include "samba.fullname" . }}:{{ .Values.service.port }}"
          nc -z -w 5 {{ include "samba.fullname" . }} {{ .Values.service.port }}
          echo "samba accepted the connection"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
