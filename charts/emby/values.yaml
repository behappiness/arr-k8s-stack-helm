# -- Number of replicas. Must be 1.
replicaCount: 1

image:
  # -- Image repository. This is Emby's own official image.
  repository: docker.io/emby/embyserver
  # -- Image tag. Pin this in production.
  tag: "4.10.0.27"
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image digest. When set, takes precedence over `image.tag`.
  digest: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the fully qualified app name used for resource names
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty.
  name: ""
  # -- Mount the ServiceAccount API token. Not needed; nothing here uses the
  # Kubernetes API.
  automount: false

# The official Emby image drops privileges to UID:GID itself.
env:
  # -- UID Emby Server runs as
  UID: 1000
  # -- GID Emby Server runs as
  GID: 1000
  # -- Timezone. Ignored if a webhook like k8tz injects one.
  TZ: Etc/UTC

# Hardware transcoding. See templates/_hwaccel.tpl for what each mode does.
#
# `none` uses software transcoding, which is CPU-expensive but works anywhere.
# Emby requires an active Emby Premiere subscription for hardware transcoding:
# without one the device is present but unused.
hardwareAcceleration:
  # -- One of `none`, `hostDevice`, `devicePlugin` or `dra`
  mode: none

  hostDevice:
    # -- Device path bind-mounted into the container
    path: /dev/dri
    # A hostPath only supplies the device inode. Opening it is gated by the
    # runtime's device cgroup, which nothing but `privileged` opens for a
    # hostPath, so without this every open() fails with EPERM. Use the
    # devicePlugin mode instead if you would rather not run privileged.
    # -- Run the container privileged, which is what makes the device usable
    privileged: true

  devicePlugin:
    # -- Resource name the plugin advertises, e.g. gpu.intel.com/i915,
    # amd.com/gpu or squat.ai/dri
    resource: ""
    # -- How many devices to request
    count: 1

  dra:
    # -- DeviceClass to claim from, e.g. gpu.nvidia.com
    deviceClassName: ""
    # -- How many devices to claim
    count: 1
    # -- CEL selectors narrowing which device is claimed. Without one, any
    # device in the class is eligible.
    selectors: []
    #  - device.attributes["gpu.nvidia.com"].productName == "NVIDIA GeForce RTX 3060"

# Emby writes transcodes under its cache directory. With nothing mounted there
# they land on the container filesystem, which is node ephemeral storage. Mount
# your own with extraVolumes/extraVolumeMounts to put them elsewhere.
persistence:
  config:
    # -- Persist Emby's configuration directory (`/config`)
    enabled: true
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- StorageClass. Falls back to `global.storageClass`, then the cluster default.
    storageClass: ""
    # -- Access mode for the config volume
    accessMode: ReadWriteOnce
    # -- Size of the config volume
    size: 1Gi
    # -- Annotations for the config PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled
    retain: false

  cache:
    # Emby's transcoding temporary path is set in its UI (Settings >
    # Transcoding). Point it at this mount so transcodes stay off the volume
    # holding the database.
    # -- Persist `/cache`
    enabled: true
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- Mount path
    mountPath: /cache
    # -- StorageClass
    storageClass: ""
    # -- Access mode
    accessMode: ReadWriteOnce
    # -- Size of the cache volume
    size: 64Gi
    # -- Annotations for the cache PVC
    annotations: {}

  media:
    # -- Mount the shared media volume, read-only. Must be the same claim, at
    # the same path, the *arrs write to.
    enabled: false
    # -- Use an existing PVC. Required when `enabled` is true and `size` is unset.
    existingClaim: ""
    # -- Mount path for the media volume
    mountPath: /data
    # -- Mount the media volume read-only
    readOnly: true
    # -- StorageClass for the media volume
    storageClass: ""
    # -- Access mode for the media volume
    accessMode: ReadWriteMany
    # -- Size of the media volume, when the chart creates it
    size: ""
    # -- Annotations for the media PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled. On by default: it
    # holds the library.
    retain: true

service:
  # -- Service type
  type: ClusterIP
  # -- Service port. The container always listens on 8096.
  port: 8096
  # -- Node port, when `service.type` is NodePort
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Service labels
  labels: {}
  # -- Static cluster IP
  clusterIP: ""
  # -- Load balancer IP, when `service.type` is LoadBalancer
  loadBalancerIP: ""
  # -- Session affinity
  sessionAffinity: ""

ingress:
  # -- Create an Ingress
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: emby.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: emby-tls
  #    hosts:
  #      - emby.local

# Gateway API alternative to `ingress`. Both may be enabled at once.
httpRoute:
  # -- Create an HTTPRoute (Gateway API)
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Gateways this route attaches to
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  # -- Hostnames matched by the route
  hostnames: []
  # -- Route rules. A sensible default rule is generated when empty.
  rules: []

# No CPU limit: throttling makes the work slower, never safer.
# -- Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 4Gi

# OnRootMismatch: otherwise every pod start re-chowns the whole media volume.
# -- Pod-level security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  supplementalGroups: []
  seccompProfile:
    type: RuntimeDefault

# Root, because s6 drops to PUID:PGID itself. The capabilities are what s6
# needs and stay within the PSA baseline profile.
# -- Container-level security context
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

# -- Liveness probe. `/System/Info/Public` answers without authentication.
livenessProbe:
  enabled: true
  httpGet:
    path: /System/Info/Public
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe
readinessProbe:
  enabled: true
  httpGet:
    path: /System/Info/Public
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe. Generous by default: first start migrates the database and
# large libraries take a while.
startupProbe:
  enabled: true
  httpGet:
    path: /System/Info/Public
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# Recreate is required with an RWO config volume.
# -- Deployment strategy
updateStrategy:
  type: Recreate

podDisruptionBudget:
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: ""
  # -- Maximum unavailable pods
  maxUnavailable: 1

networkPolicy:
  # -- Create a NetworkPolicy
  enabled: false
  # -- Ingress rules. When empty, all ingress to the service port is allowed.
  ingress: []
  # -- Egress rules. When empty, no egress restrictions are applied.
  egress: []

# -- Annotations for the pod
podAnnotations: {}
# -- Labels for the pod
podLabels: {}
# -- Annotations for the Deployment
deploymentAnnotations: {}
# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []
# -- Priority class name
priorityClassName: ""
# -- Runtime class name
runtimeClassName: ""
# -- DNS policy
dnsPolicy: ""
# -- DNS config
dnsConfig: {}
# -- Host aliases
hostAliases: []
# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- Additional environment variables, as a map of name to value
extraEnv: {}
# -- Additional environment variables in raw format, for `valueFrom`.
extraEnvRaw: []
# -- Additional envFrom sources
extraEnvFrom: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts for the main container
extraVolumeMounts: []
# -- Additional sidecar containers
extraContainers: []
# -- Additional init containers
extraInitContainers: []
# -- Additional arguments for the main container
extraArgs: []
# -- Additional labels applied to every resource in the chart
commonLabels: {}
# -- Additional annotations applied to every resource in the chart
commonAnnotations: {}
