# Exercises every optional template in the chart at once.
#
# `ct install` installs this on a kind cluster, so everything here has to be
# able to come up there. Configuration that needs something kind does not have
# - a PostgreSQL server, a GPU, VPN credentials - is rendered by the lint job
# instead.
replicaCount: 1

persistence:
  config:
    enabled: true
    size: 1Gi
    retain: true
  media:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    mountPath: /data

service:
  type: ClusterIP
  port: 8096
  annotations:
    example.com/annotation: "true"
  labels:
    example.com/label: "true"

ingress:
  enabled: true
  className: nginx
  annotations:
    example.com/annotation: "true"
  hosts:
    - host: emby.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: emby-tls
      hosts:
        - emby.example.com

httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - emby.example.com

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  egress:
    # Anywhere in the cluster. DNS lives in kube-system, so this covers it.
    - to:
        - namespaceSelector: {}
    # And the internet. These applications talk to indexers, trackers and
    # metadata providers, so a policy allowing only in-cluster egress is not a
    # realistic test - it is a broken cluster. Bazarr proved the point: it
    # blocks on GitHub during startup and never binds its port, so the startup
    # probe fails for five minutes and the install times out.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # The cloud metadata endpoint is the one thing worth keeping out.
            except:
              - 169.254.169.254/32

serviceAccount:
  create: true
  annotations:
    example.com/annotation: "true"

podAnnotations:
  example.com/annotation: "true"
podLabels:
  example.com/label: "true"
commonLabels:
  example.com/common: "true"
commonAnnotations:
  example.com/common: "true"

nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: example.com/taint
    operator: Exists
    effect: NoSchedule
priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 60

extraEnv:
  EXAMPLE_PLAIN: "value"
extraEnvRaw:
  - name: EXAMPLE_FROM_FIELD
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
extraEnvFrom:
  - configMapRef:
      name: extra-config
      optional: true
extraVolumes:
  - name: scratch
    emptyDir: {}
extraVolumeMounts:
  - name: scratch
    mountPath: /scratch
extraInitContainers:
  - name: init-noop
    image: busybox:1.37
    command: ["/bin/true"]
extraContainers:
  - name: sidecar-noop
    image: busybox:1.37
    command: ["/bin/sh", "-c", "sleep infinity"]
