apiVersion: v1
kind: Pod
metadata:
  name: {{ include "scraparr.fullname" . }}-test-connection
  labels:
    {{- include "scraparr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          set -e
          url="http://{{ include "scraparr.fullname" . }}:{{ .Values.service.port }}/metrics"
          echo "GET $url"
          wget -q -O- "$url" >/dev/null
          echo "scraparr answered /metrics"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
