# -- Number of replicas. Must be 1.
replicaCount: 1

image:
  # -- Image repository. This is the image published by the Scraparr project itself.
  repository: ghcr.io/thecfu/scraparr
  # -- Image tag. Pin this in production.
  tag: "3.2.0"
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image digest. When set, takes precedence over `image.tag`.
  digest: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the fully qualified app name used for resource names
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty.
  name: ""
  # -- Mount the ServiceAccount API token. Not needed; nothing here uses the
  # Kubernetes API.
  automount: false

# Not an s6 image: no PUID/PGID. The user comes from `securityContext`.
env:
  # -- Timezone. Ignored if a webhook like k8tz injects one.
  TZ: Etc/UTC

# Scraparr reads one config.yaml naming the instances to scrape. It has no
# defaults to fall back on: with nothing here it starts and exports nothing.
#
# Rendered verbatim into a ConfigMap, so anything scraparr accepts can go in.
# Keys per instance: url, api_key, alias, api_version, interval, detailed. Use
# a list under the service name to scrape several of the same kind.
config:
  # -- Name of an existing Secret with a `config.yaml` key holding the whole
  # file. Takes precedence over `instances`, and is the way to keep the API
  # keys out of your values.
  existingSecret: ""
  # -- The config.yaml contents. Read each application's API key from its
  # Settings > General page. Rendered into a ConfigMap, so use
  # `existingSecret` instead unless you do not mind the keys being readable.
  instances: {}
  #  sonarr:
  #    url: http://media-sonarr:8989
  #    api_key: "0123456789abcdef0123456789abcdef"
  #    api_version: v3
  #    interval: 30
  #  prowlarr:
  #    url: http://media-prowlarr:9696
  #    api_key: "0123456789abcdef0123456789abcdef"
  #    api_version: v1

persistence:
  config:
    # Scraparr keeps no state; it only reads config.yaml out of this directory.
    # Enable it to manage that file on a volume instead of a ConfigMap.
    # -- Persist `/scraparr/config`
    enabled: false
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- StorageClass. Falls back to `global.storageClass`, then the cluster default.
    storageClass: ""
    # -- Access mode for the config volume
    accessMode: ReadWriteOnce
    # -- Size of the config volume
    size: 1Gi
    # -- Annotations for the config PVC
    annotations: {}
    # -- Keep the PVC when the release is uninstalled
    retain: false

# Scraparr exists to be scraped, so unlike the *arr charts a ServiceMonitor here
# points at something real.
serviceMonitor:
  # -- Create a ServiceMonitor. Requires the Prometheus Operator CRDs.
  enabled: false
  # -- Scrape interval
  interval: 60s
  # -- Scrape timeout
  scrapeTimeout: 30s
  # -- Additional labels, for Prometheus selectors
  labels: {}
  # -- Metric relabel configurations
  metricRelabelings: []
  # -- Relabel configurations
  relabelings: []

service:
  # -- Service type
  type: ClusterIP
  # -- Service port. Must match `general.port` in the config.yaml you supply.
  port: 7100
  # -- Node port, when `service.type` is NodePort
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Service labels
  labels: {}
  # -- Static cluster IP
  clusterIP: ""
  # -- Load balancer IP, when `service.type` is LoadBalancer
  loadBalancerIP: ""
  # -- Session affinity
  sessionAffinity: ""

ingress:
  # -- Create an Ingress
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: scraparr.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: scraparr-tls
  #    hosts:
  #      - scraparr.local

# Gateway API alternative to `ingress`. Both may be enabled at once.
httpRoute:
  # -- Create an HTTPRoute (Gateway API)
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Gateways this route attaches to
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  # -- Hostnames matched by the route
  hostnames: []
  # -- Route rules. A sensible default rule is generated when empty.
  rules: []

# No CPU limit: throttling makes the work slower, never safer.
# -- Resource requests and limits
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Pod-level security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  supplementalGroups: []
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. This image runs as root by default. It
# is given a non-root UID here; if the application fails to write to its data
# directory, align `podSecurityContext.fsGroup` with `runAsUser` or set
# `runAsUser: 0`.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Liveness probe against `/metrics`.
livenessProbe:
  enabled: true
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe
readinessProbe:
  enabled: true
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Startup probe. Generous by default: first start migrates the database and
# large libraries take a while.
startupProbe:
  enabled: true
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# Recreate is required with an RWO config volume.
# -- Deployment strategy
updateStrategy:
  type: Recreate

podDisruptionBudget:
  # -- Create a PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: ""
  # -- Maximum unavailable pods
  maxUnavailable: 1

networkPolicy:
  # -- Create a NetworkPolicy
  enabled: false
  # -- Ingress rules. When empty, all ingress to the service port is allowed.
  ingress: []
  # -- Egress rules. When empty, no egress restrictions are applied.
  egress: []

# -- Annotations for the pod
podAnnotations: {}
# -- Labels for the pod
podLabels: {}
# -- Annotations for the Deployment
deploymentAnnotations: {}
# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
# -- Topology spread constraints
topologySpreadConstraints: []
# -- Priority class name
priorityClassName: ""
# -- Runtime class name
runtimeClassName: ""
# -- DNS policy
dnsPolicy: ""
# -- DNS config
dnsConfig: {}
# -- Host aliases
hostAliases: []
# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- Additional environment variables, as a map of name to value
extraEnv: {}
# -- Additional environment variables in raw format, for `valueFrom`.
extraEnvRaw: []
# -- Additional envFrom sources
extraEnvFrom: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts for the main container
extraVolumeMounts: []
# -- Additional sidecar containers
extraContainers: []
# -- Additional init containers
extraInitContainers: []
# -- Additional arguments for the main container
extraArgs: []
# -- Additional labels applied to every resource in the chart
commonLabels: {}
# -- Additional annotations applied to every resource in the chart
commonAnnotations: {}
