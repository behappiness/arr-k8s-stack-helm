{{- if and .Values.persistence.config.enabled (not .Values.persistence.config.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-config" (include "seerr.fullname" .) }}
  labels:
    {{- include "seerr.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.persistence.config.annotations .Values.commonAnnotations }}
  {{- if .Values.persistence.config.retain }}
  {{- $annotations = merge (dict "helm.sh/resource-policy" "keep") $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.config.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
  {{- include "seerr.storageClass" (dict "persistence" .Values.persistence.config "global" .Values.global "purpose" "config") | nindent 2 }}
{{- end }}
