apiVersion: v1
kind: Pod
metadata:
  name: {{ include "seerr.fullname" . }}-test-connection
  labels:
    {{- include "seerr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          set -e
          url="http://{{ include "seerr.fullname" . }}:{{ .Values.service.port }}/api/v1/status"
          echo "GET $url"
          wget -q -O- "$url" | grep -q version
          echo "seerr answered /api/v1/status"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
