{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracearr.fullname" . }}
  labels:
    {{- include "tracearr.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  database-url: {{ .Values.config.databaseUrl | quote }}
  redis-url: {{ .Values.config.redisUrl | quote }}
  jwt-secret: {{ include "tracearr.signingKey" (dict "ctx" . "value" .Values.config.jwtSecret "key" "jwt-secret") | quote }}
  cookie-secret: {{ include "tracearr.signingKey" (dict "ctx" . "value" .Values.config.cookieSecret "key" "cookie-secret") | quote }}
{{- end }}
