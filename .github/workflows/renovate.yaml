name: Renovate

# Self-hosted Renovate. Do not also install the Renovate GitHub App - running
# both duplicates every PR.
#
# Needs secret RENOVATE_TOKEN: a fine-grained PAT with contents, pull-requests,
# issues and workflows write. GITHUB_TOKEN will not do - PRs it opens do not
# trigger CI, so automerge would wait forever.

on:
  schedule:
    # Two passes: Renovate can only automerge on a run after the one that
    # created the PR. 05:00 opens, 06:00 merges what CI turned green.
    - cron: "0 5,6 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without creating PRs"
        type: boolean
        default: false
      recreate:
        description: "Recreate PRs that were previously closed unmerged"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renovate
        # Full version: this action publishes no floating major tag.
        uses: renovatebot/github-action@v46.2.1
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # Closing a PR unmerged means "not this update", permanently. This
          # overrides that for one run only.
          RENOVATE_RECREATE_WHEN: ${{ inputs.recreate && 'always' || 'auto' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
