name: Release charts

# Publishes every chart whose version changed, to two places:
#
#   - a Helm repository on GitHub Pages, for `helm repo add`
#   - the GitHub Container Registry as OCI artifacts, for `helm install oci://`
#
# Charts are versioned independently on purpose, so an upstream project can
# adopt one of them without inheriting the release cadence of the others.
# chart-releaser only publishes a chart when its Chart.yaml version is new,
# which is what makes that work.

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=norwoodj/helm-docs
  HELM_DOCS_VERSION: "1.14.2"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Regenerate chart READMEs
        # helm-docs renders the values table and the version badge from
        # values.yaml and Chart.yaml, so anything that edits those leaves the
        # README behind - Renovate every time, since it cannot run helm-docs.
        # Doing it here rather than failing the pull request is what lets those
        # updates merge on their own. The push uses GITHUB_TOKEN, which by
        # design does not trigger another workflow run, so this cannot loop.
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" | tar xz helm-docs
          ./helm-docs --chart-search-root=charts --document-dependency-values=false
          rm -f helm-docs
          if git diff --quiet -- 'charts/**/README.md'; then
            echo "READMEs already current"
          else
            git add charts/*/README.md
            git commit -m "docs: regenerate chart READMEs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "committed regenerated READMEs"
          fi

      - name: Resolve umbrella dependencies
        # The umbrella references the application charts by file://, so they
        # must be packaged into its charts/ directory before it can be built.
        run: helm dependency update charts/arr-stack

      - name: Publish to the GitHub Pages Helm repository
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io as OCI artifacts
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p .cr-release-packages-oci
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ -f "$chart/Chart.yaml" ] || continue
            version=$(helm show chart "$chart" | awk '/^version:/ {print $2}')
            if helm show chart "oci://ghcr.io/$owner/charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version already published, skipping"
              continue
            fi
            helm package "$chart" -d .cr-release-packages-oci
            helm push ".cr-release-packages-oci/$name-$version.tgz" "oci://ghcr.io/$owner/charts"
          done
