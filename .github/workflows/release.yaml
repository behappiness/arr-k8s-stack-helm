name: Release charts

# Publishes every chart whose version changed, to GitHub Pages (`helm repo
# add`) and to ghcr.io as OCI artifacts (`helm install oci://`).
#
# Charts are versioned independently so upstreams can adopt one without the
# others' release cadence; chart-releaser only publishes new versions.

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "4.2.4"
  # renovate: datasource=github-releases depName=norwoodj/helm-docs
  HELM_DOCS_VERSION: "1.14.2"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Branch tip, not the triggering commit: back-to-back releases would
          # otherwise each push READMEs the previous run already committed, and
          # fail as a non-fast-forward.
          ref: ${{ github.ref_name }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v5
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Bump the umbrella and regenerate READMEs
        # Two things Renovate cannot do in a pull request:
        #
        #   - the umbrella vendors the app charts at package time, so it needs a
        #     new version whenever one of them moves. Doing it here rather than
        #     in the PR keeps image PRs off this shared line, so they no longer
        #     conflict with each other and can merge without rebasing.
        #   - helm-docs renders the README from values.yaml and Chart.yaml.
        #
        # GITHUB_TOKEN pushes do not trigger workflows, so this cannot loop.
        run: |
          set -euo pipefail
          umbrella=charts/arr-stack/Chart.yaml
          old=$(awk '/^version:/ {print $2; exit}' "$umbrella")
          new=$(echo "$old" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "0,/^version:/s/^version:.*/version: $new/" "$umbrella"
          echo "umbrella $old -> $new"

          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" | tar xz helm-docs
          ./helm-docs --chart-search-root=charts --document-dependency-values=false
          rm -f helm-docs

          git add "$umbrella" charts/*/README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: bump umbrella to $new and regenerate READMEs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Resolve umbrella dependencies
        # The umbrella references the app charts by file://.
        run: helm dependency update charts/arr-stack

      - name: Publish to the GitHub Pages Helm repository
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io as OCI artifacts
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p .cr-release-packages-oci
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ -f "$chart/Chart.yaml" ] || continue
            version=$(helm show chart "$chart" | awk '/^version:/ {print $2}')
            if helm show chart "oci://ghcr.io/$owner/charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version already published, skipping"
              continue
            fi
            helm package "$chart" -d .cr-release-packages-oci
            helm push ".cr-release-packages-oci/$name-$version.tgz" "oci://ghcr.io/$owner/charts"
          done
