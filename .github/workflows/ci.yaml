name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every pin below carries a `renovate:` comment so the custom manager in
  # renovate.json can update it. Without one it would silently rot.

  # Track the newest Helm rather than pinning: these charts are meant to be
  # adopted upstream, so they must keep working with whatever Helm people run.
  HELM_VERSION: latest
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "0.7.0"
  # renovate: datasource=github-releases depName=norwoodj/helm-docs
  HELM_DOCS_VERSION: "1.14.2"
  # The Kubernetes version rendered manifests are validated against.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  K8S_VERSION: "1.36.3"
  # The oldest release the charts claim to support in kubeVersion. Deliberately
  # not renovated: raising it is a compatibility decision, not an update.
  K8S_VERSION_MIN: "1.25.0"
  # renovate: datasource=docker depName=kindest/node
  KIND_NODE_IMAGE: "v1.36.1"
  # CRDs installed on kind so ct install can apply the HTTPRoute and
  # ServiceMonitor that ci/full-values.yaml turns on.
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  GATEWAY_API_VERSION: "1.4.0"
  # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
  PROMETHEUS_OPERATOR_VERSION: "0.87.0"

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: ct lint
        # Not --all: ct.yaml sets check-version-increment, which would then
        # demand all 20 chart versions be bumped on any pull request. Every
        # chart is still linted unconditionally by the step below.
        run: ct lint --config ct.yaml

      - name: helm lint and kubeconform every chart, with defaults and with ci values
        run: |
          set -euo pipefail
          fail=0
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ -f "$chart/Chart.yaml" ] || continue
            echo "::group::$name"

            if [ -f "$chart/Chart.lock" ] || grep -q '^dependencies:' "$chart/Chart.yaml"; then
              helm dependency update "$chart" >/dev/null
            fi

            # ci/minimal-values.yaml is `{}` for every chart whose defaults are
            # complete, so it doubles as the defaults render. Tracearr is the
            # exception: it refuses to render without a database, by design.
            for values in $(ls "$chart"ci/*.yaml 2>/dev/null || true); do
              label="$values"; args="-f $values"
              echo "--- $name ($label)"
              # shellcheck disable=SC2086
              helm lint "$chart" $args || fail=1
              # Validate against both the newest supported Kubernetes and the
              # oldest the charts claim to support.
              for kube in "$K8S_VERSION" "$K8S_VERSION_MIN"; do
                # HTTPRoute and ServiceMonitor are CRDs, so they are not in the
                # upstream schema set kubeconform validates against. The install
                # job is what proves they apply, against real CRDs on kind.
                # shellcheck disable=SC2086
                helm template "$name" "$chart" $args \
                  | kubeconform -strict -summary \
                      -kubernetes-version "$kube" \
                      -skip HTTPRoute,ServiceMonitor \
                      -schema-location default || fail=1
              done
            done
            echo "::endgroup::"
          done
          exit $fail

      - name: Render what the install job cannot run
        # No node on kind advertises a GPU, and gluetun needs credentials, so
        # these are kept out of ci/full-values.yaml but still rendered here.
        run: |
          set -eu
          for chart in jellyfin plex emby; do
            helm template t "charts/$chart" --set hardwareAcceleration.mode=hostDevice >/dev/null
            helm template t "charts/$chart" --set hardwareAcceleration.mode=devicePlugin \
              --set hardwareAcceleration.devicePlugin.resource=gpu.intel.com/i915 >/dev/null
            helm template t "charts/$chart" --set hardwareAcceleration.mode=dra \
              --set hardwareAcceleration.dra.deviceClassName=gpu.nvidia.com >/dev/null
          done
          helm template t charts/qbittorrent --set vpn.mode=gluetun \
            --set 'vpn.lanNetworks[0]=10.0.0.0/8' >/dev/null

  umbrella:
    name: Umbrella renders and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve dependencies
        run: helm dependency update charts/arr-stack

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz             "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate the default stack
        # The lint job's loop skips the umbrella, which has no ci/ files, so
        # this is the only place its output is schema-checked.
        run: |
          helm lint charts/arr-stack
          helm template stack charts/arr-stack > /tmp/stack.yaml
          test -s /tmp/stack.yaml
          kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" \
            -skip HTTPRoute,ServiceMonitor -schema-location default < /tmp/stack.yaml

      - name: The shared media volume must be one claim, one path, no subPath
        # This is the invariant the whole stack is built around, and breaking it
        # is silent: imports keep working, they just stop being hardlinks and
        # start costing twice the disk. Asserted here rather than trusted.
        run: |
          python3 - <<'EOF'
          import yaml, sys, subprocess
          # The claim name is matched exactly. Matching on a substring would also
          # catch per-application config claims whenever the release is named
          # something like "media".
          claim = yaml.safe_load(subprocess.run(
              ["helm", "template", "stack", "charts/arr-stack", "-s", "templates/pvc-media.yaml"],
              capture_output=True, text=True, check=True).stdout)["metadata"]["name"]
          docs = [d for d in yaml.safe_load_all(open('/tmp/stack.yaml')) if d]
          consumers, paths, bad = set(), set(), []
          for d in docs:
              if d.get('kind') not in ('Deployment', 'StatefulSet'):
                  continue
              name = d['metadata']['name']
              spec = d['spec']['template']['spec']
              shared = {v['name'] for v in (spec.get('volumes') or [])
                        if (v.get('persistentVolumeClaim') or {}).get('claimName') == claim}
              for c in (spec.get('containers') or []):
                  for m in (c.get('volumeMounts') or []):
                      if m['name'] in shared:
                          consumers.add(name)
                          paths.add(m['mountPath'])
                          if m.get('subPath'):
                              bad.append(f"{name} uses subPath on the media volume")
          if not consumers:
              bad.append(f"nothing mounts the shared claim {claim}")
          if len(paths) > 1:
              bad.append(f"the media volume is mounted at several paths: {sorted(paths)}")
          if bad:
              print("HARDLINK INVARIANT BROKEN:")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print(f"ok: {len(consumers)} applications share {claim} at {paths.pop()}, no subPath")
          EOF

      - name: Guard rails must reject misconfiguration
        # Each of these is a mistake that would otherwise fail at runtime, or
        # not visibly fail at all. If a guard stops firing, the chart has
        # quietly lost a safety net.
        run: |
          set -eu
          expect_fail() {
            desc=$1; shift
            if helm template s charts/arr-stack "$@" >/dev/null 2>&1; then
              echo "GUARD MISSING: $desc was accepted but should have been rejected"
              exit 1
            fi
            echo "ok: rejected $desc"
          }
          expect_fail "split media claim"      --set sonarr.persistence.media.existingClaim=other
          expect_fail "mismatched mount path"  --set radarr.persistence.media.mountPath=/media
          expect_fail "subPath on media"       --set sonarr.persistence.media.subPath=tv
          expect_fail "RWO shared volume"      --set media.accessMode=ReadWriteOnce
          expect_fail "no media volume at all" --set media.enabled=false

  install:
    name: Install on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2

      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:${{ env.KIND_NODE_IMAGE }}

      - name: CRDs the ci values depend on
        # HTTPRoute and ServiceMonitor are CRDs. Without them `helm install`
        # rejects the manifests that ci/full-values.yaml turns on.
        run: |
          kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/v${GATEWAY_API_VERSION}/standard-install.yaml"
          kubectl apply --server-side -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"

      - name: ct install
        # Installs each *changed* chart standalone and runs its `helm test`.
        # This is the adoptability gate: a chart that needs the umbrella to
        # install has a hidden dependency and fails here.
        #
        # Not --all: that pulls every image on every pull request, which is the
        # fastest way to hit Docker Hub's anonymous rate limit, for no signal —
        # unchanged charts were proven by the run that changed them.
        run: ct install --config ct.yaml
